<rect class="pk" x="-5" y="-5" width="10" height="10" fill="#f3f1e2" stroke="#a8e27c" stroke-width="2" opacity="0"><animateMotion dur="14.0s" repeatCount="indefinite" path="M428 395.0 L380 395.0" keyPoints="0;0;1;1" keyTimes="0;0.7136;0.7714;1" calcMode="linear"/><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7126;0.7136;0.7714;0.7724;1"/></rect>
<text x="40" y="518" class="m" font-size="12" fill="#9fb0d6">The model returns an intent and a place name. The server works out the route and the numbers. The model only shapes the wording.</text>
