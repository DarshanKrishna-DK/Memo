<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">How one spoken request works</title><desc id="d">You say take me to Diwali 2025. The receptionist hears it, the server resolves the place and plans the route, the guide robot walks you through the lift and corridor to the theater, and Grandma narrates the room from facts worked out in code.</desc>
<defs><pattern id="px" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2b4c8a" fill-opacity="0.35"/></pattern>
<filter id="sg" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8e27c"/></marker></defs>
<style>.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'Courier New', monospace}.on{opacity:0.1;animation:on 14.0s ease-in-out infinite both}@keyframes on{0%{opacity:0.1}3%,15.9%{opacity:1}19.9%,100%{opacity:0.1}}.flow{animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-11}}.wave{animation:wv 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.2s}.w3{animation-delay:.4s}@keyframes wv{50%{transform:scaleY(.35)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style>
<rect width="1200" height="560" rx="18" fill="#061431"/><rect width="1200" height="560" rx="18" fill="url(#px)"/><rect x="1.5" y="1.5" width="1197" height="557" rx="17" fill="none" stroke="#173571" stroke-width="3"/>
<text x="40" y="56" class="s" font-size="24" font-weight="800" fill="#f3f1e2">One spoken request</text>
<text x="298" y="56" class="m" font-size="13" fill="#9fb0d6">voice in, a walk and a story out; every step also has a button</text>
<path d="M280 171.0 L328 171.0" fill="none" stroke="#a8e27c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" class="flow"/>
<path d="M574 171.0 L622 171.0" fill="none" stroke="#a8e27c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" class="flow"/>
<path d="M868 171.0 L916 171.0" fill="none" stroke="#a8e27c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" class="flow"/>
<path d="M1040.0 250 L1040.0 314" fill="none" stroke="#a8e27c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" class="flow"/>
<path d="M820 395.0 L772 395.0" fill="none" stroke="#a8e27c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" class="flow"/>
<path d="M428 395.0 L380 395.0" fill="none" stroke="#a8e27c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" class="flow"/>
<g><rect x="37" y="93" width="242" height="156" rx="12" fill="none" stroke="#a8e27c" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:0.0s"/><rect x="40" y="96" width="236" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="40" y="96" width="236" height="150" rx="10" fill="#a8e27c" fill-opacity="0.08" stroke="#a8e27c" stroke-width="2.5" class="on" style="animation-delay:0.0s"/><rect x="52" y="108" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="65" y="126" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">1</text><text x="88" y="127" class="s" font-size="19" font-weight="800" fill="#f3f1e2">You</text><text x="52" y="156" class="m" font-size="13" fill="#a8e27c">in the lobby</text><text x="52" y="184" class="m" font-size="13" fill="#9fb0d6">“take me to Diwali 2025”</text><text x="52" y="205" class="m" font-size="13" fill="#9fb0d6">spoken, or typed</text><text x="52" y="226" class="m" font-size="13" fill="#9fb0d6">or tap “Go to a room”</text></g>
<g><rect x="331" y="93" width="242" height="156" rx="12" fill="none" stroke="#a8e27c" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:1.8s"/><rect x="334" y="96" width="236" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="334" y="96" width="236" height="150" rx="10" fill="#a8e27c" fill-opacity="0.08" stroke="#a8e27c" stroke-width="2.5" class="on" style="animation-delay:1.8s"/><rect x="346" y="108" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="359" y="126" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">2</text><text x="382" y="127" class="s" font-size="19" font-weight="800" fill="#f3f1e2">Receptionist</text><text x="346" y="156" class="m" font-size="13" fill="#a8e27c">robot at the desk</text><text x="346" y="184" class="m" font-size="13" fill="#9fb0d6">hears the request</text><text x="346" y="205" class="m" font-size="13" fill="#9fb0d6">model returns intent</text><text x="346" y="226" class="m" font-size="13" fill="#9fb0d6">+ a place name</text></g>
<g><rect x="625" y="93" width="242" height="156" rx="12" fill="none" stroke="#f0c24a" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:3.6s"/><rect x="628" y="96" width="236" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="628" y="96" width="236" height="150" rx="10" fill="#f0c24a" fill-opacity="0.08" stroke="#f0c24a" stroke-width="2.5" class="on" style="animation-delay:3.6s"/><rect x="640" y="108" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="653" y="126" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">3</text><text x="676" y="127" class="m" font-size="19" font-weight="700" fill="#f0c24a">resolve_place</text><text x="640" y="156" class="m" font-size="13" fill="#f0c24a">server, in code</text><text x="640" y="184" class="m" font-size="13" fill="#9fb0d6">finds the event + room</text><text x="640" y="205" class="m" font-size="13" fill="#9fb0d6">2+ matches: asks one</text><text x="640" y="226" class="m" font-size="13" fill="#9fb0d6">clarifying question</text></g>
<g><rect x="919" y="93" width="242" height="156" rx="12" fill="none" stroke="#f0c24a" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:5.4s"/><rect x="922" y="96" width="236" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="922" y="96" width="236" height="150" rx="10" fill="#f0c24a" fill-opacity="0.08" stroke="#f0c24a" stroke-width="2.5" class="on" style="animation-delay:5.4s"/><rect x="934" y="108" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="947" y="126" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">4</text><text x="970" y="127" class="m" font-size="19" font-weight="700" fill="#f0c24a">plan_route</text><text x="934" y="156" class="m" font-size="13" fill="#f0c24a">server, in code</text><text x="934" y="184" class="m" font-size="13" fill="#9fb0d6">lift to the year's floor</text><text x="934" y="205" class="m" font-size="13" fill="#9fb0d6">corridor to the month</text><text x="934" y="226" class="m" font-size="13" fill="#9fb0d6">confirms from facts</text></g>
<g><rect x="821" y="317" width="340" height="156" rx="12" fill="none" stroke="#a8e27c" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:7.2s"/><rect x="824" y="320" width="334" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="824" y="320" width="334" height="150" rx="10" fill="#a8e27c" fill-opacity="0.08" stroke="#a8e27c" stroke-width="2.5" class="on" style="animation-delay:7.2s"/><rect x="836" y="332" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="849" y="350" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">5</text><text x="872" y="351" class="s" font-size="19" font-weight="800" fill="#f3f1e2">Guide robot</text><text x="836" y="380" class="m" font-size="13" fill="#a8e27c">“Follow me.”</text><text x="836" y="408" class="m" font-size="13" fill="#9fb0d6">rides the lift with you, walks</text><text x="836" y="429" class="m" font-size="13" fill="#9fb0d6">the corridor to the door</text><text x="836" y="450" class="m" font-size="13" fill="#9fb0d6">skip: tap, key or say “skip”</text></g>
<g><rect x="429" y="317" width="340" height="156" rx="12" fill="none" stroke="#a8e27c" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:9.0s"/><rect x="432" y="320" width="334" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="432" y="320" width="334" height="150" rx="10" fill="#a8e27c" fill-opacity="0.08" stroke="#a8e27c" stroke-width="2.5" class="on" style="animation-delay:9.0s"/><rect x="444" y="332" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="457" y="350" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">6</text><text x="480" y="351" class="s" font-size="19" font-weight="800" fill="#f3f1e2">Theater</text><text x="444" y="380" class="m" font-size="13" fill="#a8e27c">you take a seat</text><text x="444" y="408" class="m" font-size="13" fill="#9fb0d6">tour(room) starts</text><text x="444" y="429" class="m" font-size="13" fill="#9fb0d6">photos on the big screen</text><text x="444" y="450" class="m" font-size="13" fill="#9fb0d6">interrupt any time</text></g>
<g><rect x="37" y="317" width="340" height="156" rx="12" fill="none" stroke="#a8e27c" stroke-width="8" filter="url(#sg)" class="on" style="animation-delay:10.8s"/><rect x="40" y="320" width="334" height="150" rx="10" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><rect x="40" y="320" width="334" height="150" rx="10" fill="#a8e27c" fill-opacity="0.08" stroke="#a8e27c" stroke-width="2.5" class="on" style="animation-delay:10.8s"/><rect x="52" y="332" width="26" height="26" rx="4" fill="#03091a" stroke="#a8e27c" stroke-width="2"/><text x="65" y="350" class="m" font-size="14" font-weight="800" text-anchor="middle" fill="#a8e27c">7</text><text x="88" y="351" class="s" font-size="19" font-weight="800" fill="#f3f1e2">Grandma narrates</text><text x="52" y="380" class="m" font-size="13" fill="#a8e27c">from facts, not guesses</text><text x="52" y="408" class="m" font-size="13" fill="#9fb0d6">count, dates, who sent what</text><text x="52" y="429" class="m" font-size="13" fill="#9fb0d6">story text, then TTS audio</text><text x="52" y="450" class="m" font-size="13" fill="#9fb0d6">with subtitles, in your language</text></g>
