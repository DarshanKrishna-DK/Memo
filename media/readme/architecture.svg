<rect x="920" y="280" width="240" height="60" rx="9" fill="#0b1f4b" stroke="#d9a520" stroke-width="2"/><text x="932" y="305" class="s" font-size="17" font-weight="800" fill="#f3f1e2">Flagsmith</text><text x="932" y="326" class="m" font-size="12.5" fill="#9fb0d6">self-hosted, local eval</text>
