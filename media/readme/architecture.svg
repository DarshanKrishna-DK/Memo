<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img" aria-labelledby="t d">
<title id="t">Memo architecture</title><desc id="d">Telegram, the React and three.js web museum, Agora and Twilio talk to a FastAPI server. FastAPI uses Postgres as its database and job queue, with LISTEN/NOTIFY feeding server-sent events. A worker runs jobs and ffmpeg. FastAPI calls Sarvam with Groq and Murf as fallbacks, reads flags from self-hosted Flagsmith, and sends incidents to NudgeBee.</desc>
<defs><pattern id="px" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2b4c8a" fill-opacity="0.35"/></pattern>
<filter id="sg" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8e27c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c24a"/></marker></defs>
<style>.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'Courier New', monospace}.ln{fill:none;stroke-width:2.5}.dash{stroke-dasharray:6 5;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-11}}.hub{animation:hb 3s ease-in-out infinite}@keyframes hb{50%{opacity:0.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style>
