<rect x="414" y="251" width="372" height="21" rx="3" fill="#03091a" fill-opacity="0.6"/>
<text x="422" y="266" class="m" font-size="13" fill="#f0c24a">voice/</text><text x="546.8" y="266" class="m" font-size="13" fill="#f3f1e2">receptionist, Grandma, Agora</text>
<rect x="414" y="277" width="372" height="21" rx="3" fill="#03091a" fill-opacity="0.6"/>
<text x="422" y="292" class="m" font-size="13" fill="#f0c24a">phone/</text><text x="546.8" y="292" class="m" font-size="13" fill="#f3f1e2">invites, call flow</text>
<rect x="414" y="303" width="372" height="21" rx="3" fill="#03091a" fill-opacity="0.6"/>
<text x="422" y="318" class="m" font-size="13" fill="#f0c24a">media/</text><text x="546.8" y="318" class="m" font-size="13" fill="#f3f1e2">reels, blur scores</text>
<rect x="414" y="329" width="372" height="21" rx="3" fill="#03091a" fill-opacity="0.6"/>
<text x="422" y="344" class="m" font-size="13" fill="#f0c24a">flags.py</text><text x="546.8" y="344" class="m" font-size="13" fill="#f3f1e2">overrides, then Flagsmith</text>
<rect x="414" y="355" width="372" height="21" rx="3" fill="#03091a" fill-opacity="0.6"/>
<text x="422" y="370" class="m" font-size="13" fill="#f0c24a">observability/</text><text x="546.8" y="370" class="m" font-size="13" fill="#f3f1e2">NudgeBee incidents</text>
<rect x="400" y="505" width="400" height="100" rx="9" fill="#0b1f4b" stroke="#a8e27c" stroke-width="2"/><text x="412" y="530" class="s" font-size="17" font-weight="800" fill="#a8e27c">Postgres 16</text><text x="412" y="551" class="m" font-size="12.5" fill="#9fb0d6">one database: data + job queue</text><text x="412" y="569" class="m" font-size="12.5" fill="#9fb0d6">jobs: FOR UPDATE SKIP LOCKED</text><text x="412" y="587" class="m" font-size="12.5" fill="#9fb0d6">LISTEN/NOTIFY → SSE to the browser</text>
<rect x="920" y="505" width="240" height="60" rx="9" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><text x="932" y="530" class="s" font-size="17" font-weight="800" fill="#f3f1e2">Worker</text><text x="932" y="551" class="m" font-size="12.5" fill="#9fb0d6">tagging, reels, follow-ups</text>
<rect x="920" y="635" width="240" height="60" rx="9" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><text x="932" y="660" class="s" font-size="17" font-weight="800" fill="#f3f1e2">ffmpeg</text><text x="932" y="681" class="m" font-size="12.5" fill="#9fb0d6">reels, aged voice, audio</text>
<rect x="40" y="505" width="240" height="190" rx="9" fill="none" stroke="#2b4c8a" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="52" y="531" class="s" font-size="15" font-weight="800" fill="#f3f1e2">Legend</text>
