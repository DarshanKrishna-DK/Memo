<rect x="40" y="185" width="240" height="60" rx="9" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><text x="52" y="210" class="s" font-size="17" font-weight="800" fill="#f3f1e2">Web museum</text><text x="52" y="231" class="m" font-size="12.5" fill="#9fb0d6">React + three.js, 2D mode</text>
<rect x="40" y="280" width="240" height="60" rx="9" fill="#0b1f4b" stroke="#2b4c8a" stroke-width="2"/><text x="52" y="305" class="s" font-size="17" font-weight="800" fill="#f3f1e2">Agora ConvoAI</text><text x="52" y="326" class="m" font-size="12.5" fill="#9fb0d6">live in-room voice</text>
