<text x="420" y="130" class="s" font-size="26" font-weight="800" fill="#a8e27c">FastAPI</text>
<text x="420" y="152" class="m" font-size="11.5" fill="#9fb0d6">routes, auth, SSE stream</text>
<rect x="414" y="173" width="372" height="21" rx="3" fill="#03091a" fill-opacity="0.6"/>
<text x="422" y="188" class="m" font-size="13" fill="#f0c24a">telegram/</text><text x="546.8" y="188" class="m" font-size="13" fill="#f3f1e2">capture, commands</text>
