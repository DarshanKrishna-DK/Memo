<text x="112" y="587" class="m" font-size="11.5" fill="#9fb0d6">fallback, flags, alert</text>
<rect x="73" y="607" width="8" height="8" fill="#a8e27c"/>
<text x="112" y="615" class="m" font-size="11.5" fill="#9fb0d6">packet in flight</text>
<text x="52" y="645" class="m" font-size="12" fill="#9fb0d6">Media files live on disk</text>
<text x="52" y="662" class="m" font-size="12" fill="#9fb0d6">and go out as signed URLs.</text>
<text x="52" y="679" class="m" font-size="12" fill="#9fb0d6">Flags never block a request.</text>
